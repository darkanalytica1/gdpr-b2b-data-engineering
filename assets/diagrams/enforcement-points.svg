<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
  <title id="t">Enforcement points in a prospecting pipeline</title>
  <desc id="d">Records pass a provenance gate, are classified as role or nominal addresses, are stored with per-field timestamps, and are checked against a hashed suppression store at send time before any contact. The same suppression store is consulted by the ingest gate.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow  { stroke-dasharray: 6 6; animation: flow 3s linear infinite; }
    .hot   { animation: pulse 6s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -48 } }
    @keyframes pulse { 0%, 100% { opacity: .6 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <rect width="1200" height="480" fill="#F5F7FA"/>
  <text x="48" y="52" class="mono" font-size="12" letter-spacing="1.2" fill="#5F6B7C">FIG. 1  ·  ENFORCEMENT POINTS IN A B2B PROSPECTING PIPELINE</text>
  <text x="48" y="94" class="display" font-size="26" font-weight="600" fill="#0E1726">Compliance is enforced at each stage, not written beside the pipeline</text>

  <path class="flow" d="M20,230 H1148" fill="none" stroke="#3E5C76" stroke-width="1.75"/>

  <g class="sans" font-size="14" fill="#0E1726">
    <rect x="48" y="170" width="188" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="48" y="170" width="188" height="3" fill="#0B2545"/>
    <text x="64" y="202" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">01  PROVENANCE GATE</text>
    <text x="64" y="258">source_url, retrieved_at,</text>
    <text x="64" y="277">legal_basis all valid</text>

    <rect x="276" y="170" width="188" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="276" y="170" width="188" height="3" fill="#0B2545"/>
    <text x="292" y="202" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">02  EMAIL CLASS</text>
    <text x="292" y="258">role · nominal ·</text>
    <text x="292" y="277">junk · unknown</text>

    <rect x="504" y="170" width="188" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="504" y="170" width="188" height="3" fill="#0B2545"/>
    <text x="520" y="202" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">03  WAREHOUSE</text>
    <text x="520" y="258">each field keeps its</text>
    <text x="520" y="277">last-verified time</text>

    <rect x="732" y="170" width="188" height="120" rx="4" fill="#fff" stroke="#8A6A1F" stroke-width="1.5"/>
    <rect x="732" y="170" width="188" height="3" fill="#8A6A1F"/>
    <text x="748" y="202" class="mono" font-size="12" letter-spacing="1" fill="#8A6A1F">04  SEND-TIME CHECK</text>
    <text x="748" y="258">suppression looked up</text>
    <text x="748" y="277">per contact, right now</text>

    <rect x="960" y="170" width="188" height="120" rx="4" fill="#fff" stroke="#D8DEE6" stroke-width="1.5"/>
    <text x="976" y="202" class="mono" font-size="12" letter-spacing="1" fill="#5F6B7C">05  CONTACT</text>
    <text x="976" y="258">outreach only after</text>
    <text x="976" y="277">every check passed</text>
  </g>

  <!-- reject stubs -->
  <g class="mono" font-size="12">
    <line x1="64" y1="290" x2="64" y2="320" stroke="#D8DEE6" stroke-width="1.5"/>
    <text x="72" y="318" fill="#5F6B7C">reject + reason codes</text>
    <line x1="780" y1="290" x2="780" y2="320" stroke="#8A6A1F" stroke-width="1.5" stroke-opacity=".7"/>
    <text x="790" y="318" fill="#8A6A1F">suppressed: skip</text>
  </g>

  <!-- suppression store -->
  <path d="M232,290 V400 H330" fill="none" stroke="#3E5C76" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M890,290 V400 H860" fill="none" stroke="#3E5C76" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="330" y="356" width="530" height="90" rx="4" fill="#fff" stroke="#D8DEE6" stroke-width="1.5"/>
  <text x="350" y="386" class="mono" font-size="12" letter-spacing="1" fill="#5F6B7C">SUPPRESSION STORE</text>
  <text x="350" y="410" class="sans" font-size="14" fill="#0E1726">salted SHA-256 of the normalised address, additive,</text>
  <text x="350" y="430" class="sans" font-size="14" fill="#0E1726">kept apart from tables that imports rebuild</text>
  <text x="242" y="344" class="mono" font-size="12" fill="#5F6B7C">also checked</text>
  <text x="242" y="360" class="mono" font-size="12" fill="#5F6B7C">at ingest</text>

  <!-- travelling records -->
  <circle r="6" fill="#0B2545" stroke="#fff" stroke-width="1.5">
    <animateMotion dur="6s" repeatCount="indefinite" path="M20,230 H1054"/>
  </circle>
  <circle r="6" fill="#8A6A1F" stroke="#fff" stroke-width="1.5">
    <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M20,230 H780 V320" keyPoints="0;1;1" keyTimes="0;0.78;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="6s" begin="-3s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.8;0.88;1"/>
  </circle>
</svg>
