<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">GDPR B2B Data Engineering</title>
  <desc id="d">Records travel towards a warehouse through a provenance gate; records carrying source, retrieval time and legal basis pass, a record without provenance is diverted to rejection.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .track { stroke-dasharray: 3 7; animation: flow 6s linear infinite; }
    .reject { animation: pulse 8s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -100 } }
    @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <g id="rec">
      <rect x="-14" y="-10" width="28" height="20" rx="2" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
      <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#3E5C76" stroke-width="1.5"/>
      <line x1="-8" y1="0" x2="5" y2="0" stroke="#3E5C76" stroke-width="1.5"/>
      <line x1="-8" y1="4" x2="7" y2="4" stroke="#3E5C76" stroke-width="1.5"/>
    </g>
    <g id="bad">
      <rect x="-14" y="-10" width="28" height="20" rx="2" fill="#fff" stroke="#8A6A1F" stroke-width="1.5"/>
      <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#8A6A1F" stroke-width="1.5" stroke-dasharray="2 2"/>
    </g>
  </defs>

  <rect width="1200" height="400" fill="#F5F7FA"/>
  <rect x=".5" y=".5" width="1199" height="399" fill="none" stroke="#D8DEE6"/>

  <text x="64" y="82" class="mono" font-size="12" letter-spacing="1.8" fill="#5F6B7C">DARKANALYTICA</text>
  <rect x="64" y="108" width="48" height="3" fill="#0B2545"/>
  <text x="62" y="176" class="display" font-size="40" font-weight="600" fill="#0E1726">GDPR B2B Data Engineering</text>
  <text x="64" y="226" class="sans" font-size="19" fill="#3D4A5C">Provenance gates, hashed suppression, erasure tombstones</text>
  <text x="64" y="252" class="sans" font-size="19" fill="#3D4A5C">and per-field retention for a lawful prospecting pipeline.</text>
  <text x="64" y="330" class="mono" font-size="12" letter-spacing="1.2" fill="#5F6B7C">PYTHON  ·  GDPR  ·  LEGITIMATE INTEREST  ·  DATA ENGINEERING</text>

  <line x1="680" y1="56" x2="680" y2="344" stroke="#D8DEE6"/>

  <g>
    <text x="712" y="112" class="mono" font-size="12" fill="#5F6B7C">source_url · retrieved_at · legal_basis</text>
    <path class="track" d="M712,190 H1040" fill="none" stroke="#0E1726" stroke-width="1.5" stroke-opacity=".45"/>
    <path d="M900,190 V300 H1030" fill="none" stroke="#8A6A1F" stroke-width="1.5" stroke-opacity=".4" stroke-dasharray="3 5"/>

    <text x="872" y="140" class="mono" font-size="12" fill="#0B2545">PROVENANCE GATE</text>
    <line x1="930" y1="152" x2="930" y2="174" stroke="#0B2545" stroke-width="3"/>
    <line x1="930" y1="206" x2="930" y2="228" stroke="#0B2545" stroke-width="3"/>

    <rect x="1040" y="164" width="120" height="52" rx="4" fill="#fff" stroke="#D8DEE6" stroke-width="1.5"/>
    <rect x="1040" y="164" width="120" height="3" fill="#0B2545"/>
    <text x="1060" y="195" class="mono" font-size="12" fill="#0B2545">WAREHOUSE</text>
    <rect class="reject" x="1030" y="280" width="130" height="40" rx="4" fill="#F4EFE2" stroke="#8A6A1F" stroke-width="1.5"/>
    <text x="1046" y="305" class="mono" font-size="12" fill="#8A6A1F">REJECTED</text>

    <use href="#rec" x="0" y="0">
      <animateMotion dur="8s" begin="0s" repeatCount="indefinite" path="M712,190 H1030"/>
      <animate attributeName="opacity" dur="8s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.08;.9;1"/>
    </use>
    <use href="#rec">
      <animateMotion dur="8s" begin="-2s" repeatCount="indefinite" path="M712,190 H1030"/>
      <animate attributeName="opacity" dur="8s" begin="-2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.08;.9;1"/>
    </use>
    <use href="#rec">
      <animateMotion dur="8s" begin="-4s" repeatCount="indefinite" path="M712,190 H1030"/>
      <animate attributeName="opacity" dur="8s" begin="-4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.08;.9;1"/>
    </use>
    <use href="#bad">
      <animateMotion dur="8s" begin="-6s" repeatCount="indefinite" path="M712,190 H900 V300 H1020"/>
      <animate attributeName="opacity" dur="8s" begin="-6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.08;.9;1"/>
    </use>

    <text x="712" y="352" class="mono" font-size="12" fill="#5F6B7C">PROVENANCE  ·  SUPPRESSION  ·  ERASURE  ·  RETENTION</text>
  </g>
</svg>
